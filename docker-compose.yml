services:

  traefik:
    image: traefik:v2.11
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - web


  postgres-init:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
       - postgres_data:/var/lib/postgresql/data
       - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - backend





  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - redis_data:/data
    networks:
      - backend
    restart: always




  frontend:
    build: ./frontend
    env_file:
      - .env
    deploy:
      replicas: 2
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`) && !PathPrefix(`/api`)"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      
    networks:
      - web




  order-service:
    build: ./order-service
    env_file:
      - .env
    environment:
      DB_HOST: postgres-init
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_NAME: orders_db
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-init:5432/orders_db"
    depends_on:
      postgres-init:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.order.rule=PathPrefix(`/api/orders`)"
      - "traefik.http.middlewares.order-stripprefix.stripprefix.prefixes=/api/orders"
      - "traefik.http.routers.order.middlewares=order-stripprefix"
      - "traefik.http.routers.order.priority=300"
      - "traefik.http.services.order.loadbalancer.server.port=5002"
    networks:
      - web
      - backend



  product-service:
    build: ./product-service
    environment:
      DB_HOST: postgres-init
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_NAME: products_db
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-init:5432/products_db"
    depends_on:
      postgres-init:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.product.rule=PathPrefix(`/api/products`)"
      - "traefik.http.middlewares.product-stripprefix.stripprefix.prefixes=/api/products"
      - "traefik.http.routers.product.middlewares=product-stripprefix"
      - "traefik.http.routers.product.priority=200"
      - "traefik.http.services.product.loadbalancer.server.port=5001"
    networks:
      - web
      - backend


  user-service:
    build: ./user-service
    environment:
      DB_HOST: postgres-init
      DB_USER: ${POSTGRES_USER}
      DB_PASS: ${POSTGRES_PASSWORD}
      DB_NAME: users_db
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-init:5432/users_db"
    depends_on:
      postgres-init:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.user.rule=PathPrefix(`/api/users`)"
      - "traefik.http.middlewares.user-stripprefix.stripprefix.prefixes=/api/users"
      - "traefik.http.routers.user.middlewares=user-stripprefix"
      - "traefik.http.routers.user.priority=100"
      - "traefik.http.services.user.loadbalancer.server.port=5000"
    networks:
      - web
      - backend


volumes:
  postgres_data:
  redis_data:


networks:
  web:
    name: web
    driver: bridge

  backend:
    name: backend
    driver: bridge
    internal: true



